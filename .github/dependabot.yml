# R6-30 (R7-24 re-corrected in #343): automated dependency-update PRs, weekly.
#
# What this catches: Dependabot's default pip versioning-strategy is `increase`, so
# for a `>=` floor it opens a PR RAISING the floor to the newest release (verified
# live — e.g. the pylast/shazamio/urllib3/sounddevice/pytest floor-bump PRs). It
# also bumps the SHA-pinned GitHub Actions (EXACT pins → new SHA + version comment)
# and raises security-advisory PRs. So Dependabot IS the pip floor-drift surfacer.
# (An earlier R7-24 note wrongly claimed it opens no pip PR for a satisfied `>=`
# floor — the open pip PRs disprove that; #343.) The weekly `tests.yml` cron is a
# COMPLEMENTARY guard: it reinstalls the tree and fails the suite if a new release
# actually breaks something (a PR alone can't tell you that). R8-19/#362: GitHub
# documents a 60-day-inactivity auto-disable for schedules on PUBLIC repos (for a
# private repo, treat it as possible); a pushed commit resets it, while a manual
# workflow_dispatch run re-runs the CHECK but is NOT documented to reset the
# window — see the setup guide's Maintenance section. The floors in
# requirements.txt stay the abstract spec.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # ── STANDING POLICY: hold at the Python-3.11 floor (Lane, 2026-08-13) ──
    # The deployment target is Raspberry Pi OS Bookworm (Python 3.11) and the CI
    # matrix keeps a 3.11 leg, so the WHOLE dependency tree must stay installable
    # and importable on 3.11.  Any Dependabot PR whose new version raises the
    # package's `Requires-Python` above 3.11 must be HELD until 3.11 support is
    # deliberately dropped — regardless of the package.  Dependabot's `ignore`
    # cannot gate on Requires-Python (it only matches version ranges), so this is
    # a HUMAN-ENFORCED review rule on every bump PR, NOT something this file can
    # express in general.  The check per PR: `pip index versions <pkg>` / the
    # release's `Requires-Python` on PyPI; if it demands >3.11, close the PR with
    # a one-line reason and, if it keeps re-opening weekly, add a version `ignore`
    # entry below (as done for numpy) to stop it saturating the 5-PR limit.
    # This is a floor-hold, not a security waiver: a 3.11-compatible security
    # advisory bump still merges normally.
    #
    # R9-06 (#381) — the first instance: numpy >=2.5 requires Python >=3.12, which
    # breaks the 3.11 CI leg and the Bookworm/Legacy install path (pi-setup §6).
    # numpy's surface is 2.x-clean with no upgrade urgency, so hold the floor at
    # the 3.11-compatible 2.4.x line; the `ignore` below stops the weekly re-open.
    # Revisit when 3.11 support is dropped.
    ignore:
      - dependency-name: "numpy"
        versions: [">=2.5.0"]
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
