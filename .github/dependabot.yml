# R6-30 (corrected R7-24): automated dependency-update PRs, weekly.
#
# What this actually catches — and what it does NOT: Dependabot version-updates
# raise a PR only when the manifest does not already permit the newest release.
# requirements.txt is `>=`-FLOOR-pinned with no lockfile (the Option-A decision),
# so a new upstream release already SATISFIES the floor → Dependabot opens NO pip
# PR for it. Floor drift is instead caught by the weekly `tests.yml` cron, which
# reinstalls the tree and fails if a new release breaks the suite. Dependabot's
# real jobs here are: the SHA-pinned GitHub Actions (EXACT pins → it bumps the SHA
# + the version comment) and security advisories (a vulnerable dependency still
# gets a PR regardless of the floor). The floors in requirements.txt stay the
# abstract spec.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
