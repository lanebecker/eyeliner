name: tests

# TQ-9: run the test suite on every push / PR so a regression is caught before it
# reaches the appliance. R5-33/R6-33: three-leg matrix — 3.11 (the Raspberry Pi
# OS bookworm/Legacy system Python and the version the app targets), 3.12
# (claimed supported by the setup guide), and 3.13 (the current default Pi OS
# "trixie" image, via the audioop-lts backport
# in requirements.txt). R8-08 (#361): the 3.13 leg catches the #198 class —
# audioop removal breaking `import shazamio` at runtime — ONLY because
# tests/test_ci_integrity_r8.py HARD-imports shazamio on the running interpreter.
# (The suite's only other touch of the real module is pytest.importorskip, which
# SKIPS — reports green — on failure, so before that test this comment's claim
# was aspirational: a broken 3.13 import left the whole matrix green.)
on:
  # R6-37: run on main pushes + every PR (not every branch push), so a push to a
  # PR branch triggers ONE run via pull_request instead of both push and
  # pull_request. R6-30: a weekly scheduled run catches a drifted/compromised
  # floor-pinned dependency in CI within a week, rather than at Pi bring-up between
  # pushes (requirements.txt is `>=`-pinned, so a new upstream release lands
  # silently).
  push:
    branches: [main]
  pull_request:
  schedule:
    # R6-30/#343: the weekly cron COMPLEMENTS Dependabot — Dependabot opens the pip
    # floor-bump PRs (its `increase` strategy raises a `>=` floor to the newest
    # release), but only the cron reinstalls the tree and FAILS the suite if a new
    # release actually breaks something, which a PR alone can't tell you. ⚠ GitHub
    # documents DISABLING a scheduled workflow after 60 days without repository
    # activity on PUBLIC repos (treat it as possible on a private one, R8-19) —
    # re-enable it (or push any commit) if the weekly run stops.
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC
  # R7-24: manual trigger so the drift check can be run on demand without waiting
  # for Monday. (R8-19: a dispatch re-runs the CHECK; it is not documented to
  # reset any schedule-disable window.)
  workflow_dispatch:

# R5-35 (TQ-5 parity with the version-metadata workflow): scope the token to read-only.
# This job installs the full pip dependency tree on every push/PR, so it must not
# run with the repository-default GITHUB_TOKEN write permissions.
permissions:
  contents: read

# R6-37: keep only the newest run per ref alive — a fresh push / PR-sync cancels
# the superseded matrix instead of running two full matrices to completion.
# R7-23: include github.event_name in the group. A `schedule` run executes with
# github.ref = refs/heads/main, the SAME ref as a main-branch push, so without the
# event_name they shared one cancel-in-progress group: the Monday cron would
# cancel an in-flight push run (regression signal ends "cancelled"), and a push
# would silently cancel the weekly run (voiding the R6-30 drift-catch guarantee
# with nothing red). Separating by event keeps push-cancels-push while never
# letting the schedule and a push cancel each other.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']   # R6-33: 3.12 now tested (pi-setup-guide claims it)
    env:
      # Make pygame headless: SDL needs no real video/audio device in CI. The
      # sounddevice import is stubbed by tests/conftest.py before any test module
      # loads, so no PortAudio system package is required either.
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      # R5-35: third-party actions SHA-pinned (not floating tags), mirroring the
      # badge workflow's hardening. Update the SHA + the trailing version comment
      # together when bumping.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: pytest -q
