[pytest]
# auto mode runs `async def test_*` without a per-test @pytest.mark.asyncio.
# The suite relies on this — do NOT switch to `strict` without first decorating
# every async test, or they silently become no-op passes (T-Quality / #54).
asyncio_mode = auto
testpaths = tests
# #174: a generous global per-test timeout (pytest-timeout). Every real test runs
# in well under a second, so 60s never false-trips — but an infinite-loop
# regression (e.g. a broken eviction loop) now fails fast with a stack dump
# instead of hanging CI (or a local run) indefinitely. Signal method (default on
# POSIX: CI + the Raspberry Pi) interrupts a wedged pure-Python loop.
timeout = 60
